<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Tools</title>
<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    background: #1a1b1e;
    margin: 0;
    padding: 40px;
    color: #e4e4e7;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #26272b;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    padding: 24px 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 20px;
    text-align: center;
    color: #f0f0f2;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    padding: 10px 6px;
    border-bottom: 1px solid #33343a;
  }
  li:last-child {
    border-bottom: none;
  }
  a {
    color: #7cb0ff;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  .desc {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    color: #9a9aa2;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Web Tools</h1>
  <ul>
    <li>
      <a href="date-offset-calculator/">Date Offset Calculator</a>
      <span class="desc">Add Critical / High / Medium day offsets to a start date.</span>
    </li>
  </ul>
</div>
</body>
</html>
